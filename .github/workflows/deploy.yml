name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only needs to publish a Pages artifact and report status.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let the newest commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is plain ES modules plus shader text files - there is no build
      # step, so the deployment artifact is the site directory itself.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Fail loudly rather than deploying a page that cannot load its shaders.
          test -f _site/index.html
          test -f _site/src/app.js
          test -d _site/src/shaders
          echo "staged $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
